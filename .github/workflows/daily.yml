name: Make kids video

on:
  schedule:
    - cron: "30 3 * * *"   # every day 9:00 AM India time
  workflow_dispatch:        # lets you press "Run workflow" manually

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          pip install -q edge-tts requests

      - name: Build next video
        id: build
        run: python make_videos.py

      - name: Publish release and tell Make.com
        if: steps.build.outputs.story_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          ID="${{ steps.build.outputs.story_id }}"
          TITLE=$(jq -r .title videos/$ID/meta.json)
          DESC=$(jq -r .description videos/$ID/meta.json)
          gh release create "$ID" videos/$ID/small.mp4 videos/$ID/thumbnail.jpg \
            --title "$TITLE" --notes "Auto-generated video $ID"
          URL="https://github.com/${{ github.repository }}/releases/download/$ID/small.mp4"
          jq -n --arg t "$TITLE" --arg d "$DESC" --arg u "$URL" \
            '{title:$t, description:$d, video_url:$u}' \
            | curl -sS --fail -X POST -H "Content-Type: application/json" -d @- "$MAKE_WEBHOOK_URL"
          echo "$ID" >> done.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add done.txt
          git commit -m "Done: $ID"
          git push
